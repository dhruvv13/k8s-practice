releases:
  - name: redis-cart
    chart: ./charts/redis
    values:
      - appName: redis-cart
        appImage: redis
        appVersion: alpine
        containerPort: 6379
        servicePort: 6379

  - name: emailservice
    chart: ./charts/microservice
    values: [{appName: emailservice, appImage: gcr.io/google-samples/microservices-demo/emailservice, appVersion: v0.2.3, containerPort: 8080, servicePort: 8080}]

  - name: productcatalogservice
    chart: ./charts/microservice
    values: [{appName: productcatalogservice, appImage: gcr.io/google-samples/microservices-demo/productcatalogservice, appVersion: v0.2.3, containerPort: 3550, servicePort: 3550}]

  - name: recommendationservice
    chart: ./charts/microservice
    values:
      - appName: recommendationservice
        appImage: gcr.io/google-samples/microservices-demo/recommendationservice
        appVersion: v0.2.3
        containerPort: 8080
        servicePort: 8080
        containerEnvVars: [{name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}]

  - name: currencyservice
    chart: ./charts/microservice
    values: [{appName: currencyservice, appImage: gcr.io/google-samples/microservices-demo/currencyservice, appVersion: v0.2.3, containerPort: 7000, servicePort: 7000}]

  - name: shippingservice
    chart: ./charts/microservice
    values: [{appName: shippingservice, appImage: gcr.io/google-samples/microservices-demo/shippingservice, appVersion: v0.2.3, containerPort: 50051, servicePort: 50051}]

  - name: paymentservice
    chart: ./charts/microservice
    values: [{appName: paymentservice, appImage: gcr.io/google-samples/microservices-demo/paymentservice, appVersion: v0.2.3, containerPort: 50051, servicePort: 50051}]

  - name: adservice
    chart: ./charts/microservice
    values: [{appName: adservice, appImage: gcr.io/google-samples/microservices-demo/adservice, appVersion: v0.2.3, containerPort: 9555, servicePort: 9555}]

  - name: cartservice
    chart: ./charts/microservice
    values:
      - appName: cartservice
        appImage: gcr.io/google-samples/microservices-demo/cartservice
        appVersion: v0.2.3
        containerPort: 7070
        servicePort: 7070
        containerEnvVars: [{name: REDIS_ADDR, value: "redis-cart:6379"}]

  - name: checkoutservice
    chart: ./charts/microservice
    values:
      - appName: checkoutservice
        appImage: gcr.io/google-samples/microservices-demo/checkoutservice
        appVersion: v0.2.3
        containerPort: 5050
        servicePort: 5050
        containerEnvVars:
          - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}
          - {name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051"}
          - {name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051"}
          - {name: EMAIL_SERVICE_ADDR, value: "emailservice:8080"}
          - {name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000"}
          - {name: CART_SERVICE_ADDR, value: "cartservice:7070"}

  - name: frontend
    chart: ./charts/microservice
    values:
      - appName: frontend
        appImage: gcr.io/google-samples/microservices-demo/frontend
        appVersion: v0.2.3
        containerPort: 8080
        servicePort: 80
        serviceType: NodePort
        containerEnvVars:
          - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}
          - {name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000"}
          - {name: CART_SERVICE_ADDR, value: "cartservice:7070"}
          - {name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080"}
          - {name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051"}
          - {name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050"}
          - {name: AD_SERVICE_ADDR, value: "adservice:9555"}
